<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flash card อาญา Final</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, phone-first study cards
   IDEA: one frosted glass index card held upright in the hand
   PICTURE: the portrait card itself, filling the screen
   COLOUR and TYPE: white glass over soft sky and peach light, orange เหตุ, blue ผล; IBM Plex Sans Thai, large sizes
   LAYOUT: one slim top bar, the card, one slim bottom bar */
:root{color-scheme:light dark;
--bg:light-dark(#f6f8fb,#0f141b);--ink:light-dark(#18202b,#e8edf3);--mute:light-dark(#5b6676,#9aa6b5);
--glass:light-dark(rgba(255,255,255,.62),rgba(30,38,50,.58));--line:light-dark(rgba(255,255,255,.95),rgba(255,255,255,.12));--edge:light-dark(rgba(24,32,43,.09),rgba(0,0,0,.45));
--or:light-dark(#c2560c,#f59e5b);--bl:light-dark(#1d5fd1,#7fb0ff);--rd:light-dark(#c81e3a,#ff7d8f);--hl:light-dark(#fff2a8,#5a4d12);--gr:light-dark(#18794e,#6fd3a2)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;overflow:hidden}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none}
.sky i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.sky i:nth-child(1){width:70vmax;height:70vmax;left:-30vmax;top:-30vmax;background:light-dark(#bfe0ff,#1d3a5f)}
.sky i:nth-child(2){width:55vmax;height:55vmax;right:-25vmax;bottom:-20vmax;background:light-dark(#ffd9c2,#5a3220)}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.bar{width:min(100%,460px);display:flex;align-items:center;gap:10px}
select,button{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;min-height:46px;box-shadow:0 4px 16px var(--edge)}
select{flex:1;font-size:17px;padding:0 14px;appearance:none;cursor:pointer}
button{width:46px;flex:none;font-size:20px;cursor:pointer;display:grid;place-items:center;padding:0}
select:focus-visible,button:focus-visible,.card:focus-visible .face{outline:3px solid var(--bl);outline-offset:2px}
.stage{flex:1;width:min(100%,460px);perspective:1600px;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:100%;height:100%;max-height:min(720px,calc((min(100vw,460px) - 28px)*1.62));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer;outline:none;touch-action:pan-y}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 18px 50px var(--edge),inset 0 1px 0 var(--line);padding:26px 24px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{font-size:15px;color:var(--mute)}
.tag b{font-weight:600}.tag .r{color:var(--bl)}.tag .e{color:var(--gr)}
.mid{margin:auto 0}.topic{font-size:18px;line-height:1.5;color:var(--mute);font-weight:600;margin-bottom:14px}.ex .topic{font-size:clamp(20px,5.6vw,23px);color:var(--ink);font-weight:500;padding:14px 16px;border-radius:16px;background:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.06));border:1px solid var(--line)}.ask{font-size:clamp(25px,7vw,30px);line-height:1.4;font-weight:700;text-wrap:balance}.hint{font-size:14px;color:var(--mute);text-align:center}
.a{margin-top:14px;font-size:clamp(18px,5vw,20px);line-height:1.65}
.a p{margin:0 0 12px}.a ul,.a ol{margin:0 0 12px;padding-inline-start:24px}.a li{margin:3px 0}
.a .k{font-weight:700;margin-inline-end:8px}.a .c{color:var(--or)}.a .e{color:var(--bl)}.a .w{color:var(--rd);font-weight:600}
.a mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:4px}
.a .n{font-size:16px;color:var(--mute);border-top:1px solid var(--edge);padding-top:12px;margin-top:14px}

.stage{position:relative}
.drag{position:relative;width:100%;height:100%;perspective:1600px;user-select:none;-webkit-user-select:none;max-height:min(720px,calc((min(100vw,460px) - 28px)*1.62));touch-action:pan-y;will-change:transform}
.drag .card{max-height:none}
.stamp{position:absolute;top:22px;z-index:5;font-size:22px;font-weight:700;padding:6px 14px;border-radius:12px;border:3px solid;opacity:0;pointer-events:none;background:var(--glass)}
.stamp.sok{left:20px;color:var(--gr);transform:rotate(-12deg)}.stamp.sno{right:20px;color:var(--rd);transform:rotate(12deg)}
.pill{width:auto;flex:1;font-size:17px;font-weight:600;padding:0 12px;min-height:52px}
.pill.sok{color:var(--gr)}.pill.sno{color:var(--rd)}
.count{font-size:15px;color:var(--mute);white-space:nowrap}
.done{position:absolute;inset:0;display:none;text-align:center;gap:12px}
.done .sum{font-size:19px;color:var(--mute);margin:14px 0 0}
.acts{display:flex;flex-direction:column;gap:10px}
.ok-t{color:var(--gr);font-weight:700}.no-t{color:var(--rd);font-weight:700}
.sec .mid{text-align:center}.sec .topic{color:var(--ink);margin-bottom:22px}
.sn{display:block;font-size:clamp(44px,13vw,58px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.sp{display:block;font-size:clamp(22px,6.4vw,27px);font-weight:600;color:var(--bl);margin-top:6px}
.st{display:block;font-size:17px;font-weight:500;color:var(--mute);margin-top:10px}
.title{width:min(100%,460px);text-align:center;font-size:15px;font-weight:600;color:var(--mute);line-height:1.4}.title b{color:var(--ink)}
.face{text-align:center}.mid{text-align:center}.back .a{margin:auto 0}
.a ul,.a ol{display:inline-block;text-align:start;margin-inline:auto}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i></div>
<div class="app">
<div class="title">สำหรับทบทวนสอบ Final อาญาหลักทั่วไป</div>
<div class="bar"><select id="deck" aria-label="เลือกหมวด"></select><span class="count" id="pos"></span><button id="shuf" aria-label="สลับลำดับ" title="สลับลำดับ">⤨</button></div>
<div class="stage" id="stage">
<div class="drag" id="drag">
<div class="stamp sok" id="sok">เข้าใจแล้ว</div><div class="stamp sno" id="sno">ยังไม่มั่นใจ</div>
<div class="card" id="card" tabindex="0" role="button" aria-label="แตะเพื่อพลิกการ์ด">
<div class="face front"><div class="tag" id="ft"></div><div class="mid"><div class="topic" id="fq"></div><div class="ask" id="fk"></div></div><div class="hint">แตะเพื่อดูคำตอบ · ปัดขวาเข้าใจ ปัดซ้ายยังไม่มั่นใจ</div></div>
<div class="face back"><div class="tag" id="bt"></div><div class="a" id="ba"></div></div>
</div></div>
<div class="done face" id="done"><div class="mid"><div class="ask">จบหมวดนี้แล้ว</div><p class="sum" id="sum"></p></div><div class="acts"><button class="pill sno" id="rev">ทบทวนใบที่ยังไม่มั่นใจ</button><button class="pill" id="restart">เริ่มใหม่ทั้งหมวด</button></div></div>
</div>
<div class="bar"><button class="pill sno" id="no">✕ ยังไม่มั่นใจ</button><button id="undo" aria-label="ย้อนกลับใบก่อนหน้า" title="ย้อนกลับ">↶</button><button class="pill sok" id="ok">✓ เข้าใจแล้ว</button></div>
</div>
<script>
{
const DECK={s:'ขอบเขต มาตรา 4 ถึง 8',a:'พยายาม มาตรา 80 ถึง 82',p:'หลายคน มาตรา 83 ถึง 89',t:'โทษ ทฤษฎี และริบทรัพย์',w:'รอการลงโทษ มาตรา 56 ถึง 58'};
const H=t=>`<p><span class="k c">เหตุ</span>${t}</p>`,R=t=>`<p><span class="k e">ผล</span>${t}</p>`,N=t=>`<p class="n">${t.split(' · ').join('<br>')}</p>`,W=t=>`<span class="w">${t}</span>`,M=t=>`<mark>${t}</mark>`,P=t=>`<p>${t}</p>`;
const C=[];const r=(d,q,a)=>C.push({d,t:'r',q,a}),e=(d,q,a)=>C.push({d,t:'e',q,a});
r('s','เทียบหลักดินแดน หลักอำนาจลงโทษสากล และหลักบุคคล',`<ul><li><b>ดินแดน</b> มาตรา 4 ถึง 6 ไม่จำกัดสัญชาติ ไม่จำกัดฐาน ไม่ต้องร้องขอ</li><li><b>สากล</b> มาตรา 7 ไม่จำกัดสัญชาติ จำกัดฐาน ไม่ต้องร้องขอ</li><li><b>บุคคล</b> มาตรา 8 จำกัดสัญชาติ จำกัดฐาน ${W('ต้องร้องขอ')}</li></ul>`);
r('s','มาตรา 4 วรรคหนึ่ง กระทำความผิดในราชอาณาจักร',H('ผู้ใดกระทำความผิดในราชอาณาจักร (ทุกขั้นตอนในราชอาณาจักร)')+R(M('ต้องรับโทษตามกฎหมาย')+' แม้ผลไปเกิดนอกราชอาณาจักร')+N('ราชอาณาจักร คือพื้นดิน พื้นน้ำ อากาศเหนือทั้งสอง และทะเลอาณาเขต 12 ไมล์ทะเล ไม่รวมสถานทูตไทยในต่างประเทศและเขตเศรษฐกิจจำเพาะ'));
r('s','มาตรา 4 วรรคสอง เรือไทยหรืออากาศยานไทย',H('กระทำความผิดในเรือไทยหรืออากาศยานไทย ไม่ว่าจะอยู่ ณ ที่ใด')+R(M('ถือว่ากระทำความผิดในราชอาณาจักร'))+P(W('ระวัง !')+' แค่ผลเกิดบนเรือหรืออากาศยานไทย ไม่เข้าวรรคสอง'));
e('s','ยิงในไทย ผู้ถูกยิงไปตายในกัมพูชา',P(M('มาตรา 4 วรรคหนึ่ง')+' ความตายเป็นเพียงผล'));
e('s','ให้ยาพิษที่สุวรรณภูมิ ผู้เสียหายตายบนเครื่องบินไทยเหนือน่านฟ้าจีน',P(M('มาตรา 4 วรรคหนึ่ง')+' เพราะการกระทำทั้งหมดเกิดในราชอาณาจักร ความตายเป็นเพียงผล'));
e('s','คนญี่ปุ่นลักทรัพย์คนเกาหลี บนเครื่องบินไทยที่จอดอยู่สนามบินไทย',P(M('มาตรา 4 วรรคหนึ่ง')+' ไม่ใช่วรรคสอง เพราะอยู่ในราชอาณาจักรอยู่แล้ว'));
e('s','คนญี่ปุ่นยิงคนเกาหลี บนเครื่องบินไทยที่จอดอยู่โตเกียว',P(M('มาตรา 4 วรรคสอง')));
r('s','มาตรา 5 วรรคหนึ่ง การกระทำส่วนหนึ่งหรือผลเกิดในราชอาณาจักร',H('(ส่วนแรก) การกระทำแม้ส่วนหนึ่งส่วนใดกระทำในราชอาณาจักร หรือ (ส่วนหลัง) ผลเกิดในราชอาณาจักร โดยผู้กระทำประสงค์ หรือโดยลักษณะควรเกิด หรือย่อมเล็งเห็นได้')+R(M('ถือว่าความผิดนั้นกระทำในราชอาณาจักร'))+P(W('ระวัง !')+' ผลเกิดในราชอาณาจักรไม่รวมเรือหรืออากาศยานไทย'));
r('s','มาตรา 5 วรรคสอง ตระเตรียมหรือพยายามนอกราชอาณาจักร',H('ตระเตรียมหรือพยายามนอกราชอาณาจักร ซึ่งถ้ากระทำตลอดจนสำเร็จ ผลจะเกิดในราชอาณาจักร')+R(M('ถือว่าการตระเตรียมหรือพยายามนั้นกระทำในราชอาณาจักร')));
e('s','ยืนในกัมพูชายิงคนที่อยู่ในไทย',P(M('มาตรา 5 วรรคหนึ่งส่วนแรก')+' ตายหรือหลบทันก็เข้า'));
e('s','ให้ยาสลบบนรถทัวร์ในมาเลเซีย แล้วปลดนาฬิกาเอาไปเมื่อรถเข้าไทย',P('ชิงทรัพย์ '+M('มาตรา 5 วรรคหนึ่งส่วนแรก')));
e('s','ให้ยาพิษที่ปักกิ่ง รู้ว่าจะออกฤทธิ์ตอนเครื่องลงจอดไทย และตายที่ไทย',P(M('มาตรา 5 วรรคหนึ่งส่วนหลัง')));
e('s','ยืนกัมพูชาเล็งปืนมาที่คนในไทย แล้วถูกจับก่อนยิง',P(M('มาตรา 5 วรรคสอง')));
e('s','ให้ยาพิษที่ต่างประเทศ ผู้เสียหายตายบนเครื่องบินไทยกลางอากาศ',P(W('ไม่เข้าเลย')+' ทั้งมาตรา 4 วรรคสอง และมาตรา 5 เพราะแค่ผลเกิดบนอากาศยานไทย'));
r('s','มาตรา 6 ตัวการ ผู้ใช้ ผู้สนับสนุนกระทำนอกราชอาณาจักร',H('ความผิดกระทำหรือถือว่ากระทำในราชอาณาจักร แต่ตัวการ ผู้สนับสนุน หรือผู้ใช้กระทำนอกราชอาณาจักร')+R(M('ถือว่าบุคคลเหล่านั้นกระทำในราชอาณาจักร'))+P(W('สำคัญ !')+' ต้องมีความผิดของผู้ลงมือเกิดในไทยก่อน'));
e('s','จ้างในกัมพูชาให้ฆ่าคนในไทย ผู้ถูกจ้างฆ่าในไทยสำเร็จ',P('ผู้ลงมือ มาตรา 4 วรรคหนึ่ง · ผู้ใช้ '+M('มาตรา 6')));
e('s','จ้างในกัมพูชาให้ฆ่าคนในไทย แต่ผู้ถูกจ้างถูกจับในกัมพูชาก่อนลงมือ',P('ใช้มาตรา 6 ไม่ได้ ยังไม่มีความผิดตามหลักดินแดน '+W('แต่ !')+' ถ้าผู้ใช้เป็นคนไทย ร้องขอตาม'+M('มาตรา 8 (ก)')+' ได้ ถ้าเป็นคนต่างด้าวไป (ข)'));
r('s','มาตรา 7 หลักอำนาจลงโทษสากล',H('กระทำความผิดที่ระบุนอกราชอาณาจักร เช่น')+`<ul><li>ความมั่นคง</li><li>ก่อการร้าย</li><li>ปลอมแปลงเงินตราและอากรแสตมป์</li><li>เพศแบบแม่เล้าจัดหาพาไป</li><li>ชิงหรือปล้นทรัพย์ในทะเลหลวง</li></ul>`+R(M('ต้องรับโทษในราชอาณาจักร')+' ไม่คำนึงสัญชาติ ไม่ต้องร้องขอ')+N('ความผิดที่ระบุไม่ได้มีเพียงเท่านี้ ควรดูตัวบทมาตรา 7 ประกอบ'));
r('s','มาตรา 8 หลักบุคคล',H('กระทำความผิดที่ระบุนอกราชอาณาจักร และ (ก) ผู้กระทำเป็นคนไทย และรัฐบาลประเทศที่เกิดเหตุหรือผู้เสียหายร้องขอ หรือ (ข) ผู้กระทำเป็นคนต่างด้าว รัฐบาลไทยหรือคนไทยเป็นผู้เสียหาย และผู้เสียหายร้องขอ')+R(M('ต้องรับโทษภายในราชอาณาจักร'))+N('ฐานที่ต้องจำ ชีวิต 288 ถึง 290 · ร่างกาย 295 ถึง 298 · ทรัพย์ · ทำให้เสียทรัพย์ · ข้อสอบไม่บอกเรื่องร้องขอ ต้องเขียนเงื่อนไขไว้'));
e('s','หญิงไทยถูกสามีทำร้ายจนแท้ง ในประเทศที่ไม่ถือว่าเป็นความผิด',P('กลับไทยแล้ว'+M('ร้องขอตามมาตรา 8')+' ได้ ไม่จำเป็นต้องเป็นความผิดตามกฎหมายประเทศที่เกิดเหตุ'));
r('a','มาตรา 80 พยายามกระทำความผิด',H('มีเจตนาและลงมือกระทำความผิด แต่กระทำไปไม่ตลอด หรือกระทำไปตลอดแล้วแต่ไม่บรรลุผล')+R(M('เป็นการพยายาม ระวางโทษสองในสามของโทษความผิดนั้น'))+N('อ้างประกอบฐานเสมอ เช่น มาตรา 288 ประกอบมาตรา 80'));
r('a','การลงมือ',P('<b>หลักความใกล้ชิดต่อผล</b> ฎ 1203/2491 คือการกระทำขั้นสุดท้ายของผู้กระทำ (Last act) ตามแผนของตน ไม่ต้องรอการกระทำของผู้เสียหาย และรวมขั้นที่ต่อเนื่องเป็นก้อนเดียวกัน เช่น ยกปืนเล็ง เงื้อมีด'));

const $=id=>document.getElementById(id),card=$('card'),drag=$('drag');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let deck='all',order=C.map((_,n)=>n),list=[],i=0,busy=false,mark={};
try{mark=JSON.parse(localStorage.getItem('fc-mark')||'{}')}catch(_){}
const save=()=>{try{localStorage.setItem('fc-mark',JSON.stringify(mark))}catch(_){}};
$('deck').innerHTML=`<option value="all">ทุกหมวด · ${C.length} ใบ</option>`+Object.entries(DECK).map(([k,v])=>`<option value="${k}">${v} · ${C.filter(c=>c.d===k).length} ใบ</option>`).join('');
const inDeck=()=>order.filter(n=>deck==='all'||C[n].d===deck);
function start(only){list=inDeck().filter(n=>!only||mark[n]==='no');i=0;show()}
function show(){card.classList.remove('flip');drag.style.transition='none';drag.style.transform='';$('sok').style.opacity=0;$('sno').style.opacity=0;
const end=i>=list.length;drag.style.display=end?'none':'';$('done').style.display=end?'flex':'none';$('ok').disabled=$('no').disabled=end;
if(end){const d=inDeck(),ok=d.filter(n=>mark[n]==='ok').length,no=d.filter(n=>mark[n]==='no').length;
$('sum').innerHTML=`<span class="ok-t">เข้าใจแล้ว ${ok}</span> · <span class="no-t">ยังไม่มั่นใจ ${no}</span> · จากทั้งหมด ${d.length} ใบ`;
$('rev').style.display=no?'':'none';$('rev').textContent=`ทบทวนใบที่ยังไม่มั่นใจ ${no} ใบ`;$('pos').textContent=`${list.length} จาก ${list.length}`;return}

$('ft').innerHTML=tg;$('bt').innerHTML=tg;{const m=c.t==='r'&&c.q.match(/^(มาตรา \S+)(?: (วรรค\S+?(?:และวรรค\S+)?))?(?: (.*))?$/);card.classList.toggle('sec',!!m);
$('fq').innerHTML=m?`<span class="sn">${m[1]}</span>${m[2]?`<span class="sp">${m[2]}</span>`:''}${m[3]?`<span class="st">${m[3]}</span>`:''}`:c.q;}$('fk').textContent=c.k;card.classList.toggle('ex',c.t==='e');
$('ba').innerHTML=c.a;$('ba').parentNode.scrollTop=0;$('pos').textContent=`${i+1} จาก ${list.length}`}
function answer(v){if(busy||i>=list.length)return;mark[list[i]]=v;save();const dir=v==='ok'?1:-1;
if(RM){i++;show();return}busy=true;$(v==='ok'?'sok':'sno').style.opacity=1;
drag.style.transition='transform .28s ease-in';drag.style.transform=`translateX(${dir*130}vw) rotate(${dir*24}deg)`;
setTimeout(()=>{busy=false;i++;show()},280)}
const flip=()=>card.classList.toggle('flip');
let x0=null,y0=0,dx=0,moved=false,pid=null;
drag.addEventListener('pointerdown',ev=>{if(busy)return;x0=ev.clientX;y0=ev.clientY;dx=0;moved=false;pid=ev.pointerId;drag.style.transition='none'});
drag.addEventListener('pointermove',ev=>{if(x0===null||ev.pointerId!==pid)return;dx=ev.clientX-x0;const dy=ev.clientY-y0;
if(!moved&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){moved=true;try{drag.setPointerCapture(pid)}catch(_){}}
if(!moved)return;drag.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;const p=Math.min(1,Math.abs(dx)/110);$('sok').style.opacity=dx>0?p:0;$('sno').style.opacity=dx<0?p:0});
const up=ev=>{if(x0===null)return;const wasMoved=moved;x0=null;moved=false;
if(!wasMoved){if(ev.type==='pointerup')flip();return}
if(Math.abs(dx)>100){answer(dx>0?'ok':'no')}else{drag.style.transition='transform .25s ease';drag.style.transform='';$('sok').style.opacity=0;$('sno').style.opacity=0}};
drag.addEventListener('pointerup',up);drag.addEventListener('pointercancel',up);
$('ok').addEventListener('click',()=>answer('ok'));$('no').addEventListener('click',()=>answer('no'));
$('undo').addEventListener('click',()=>{if(i>0){i--;show()}});
$('deck').addEventListener('change',ev=>{deck=ev.target.value;start(false)});
$('shuf').addEventListener('click',()=>{for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}start(false)});
$('rev').addEventListener('click',()=>start(true));$('restart').addEventListener('click',()=>start(false));
document.addEventListener('keydown',ev=>{if(ev.target.closest('select'))return;const k=ev.key;
if(k===' '||(k==='Enter'&&ev.target===card)){ev.preventDefault();flip()}else if(k==='ArrowRight')answer('ok');else if(k==='ArrowLeft')answer('no');else if(k==='Backspace'||k==='z'){if(i>0){i--;show()}}});
start(false);
}
